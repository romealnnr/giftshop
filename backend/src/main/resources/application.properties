spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:giftshop}
spring.datasource.username=${POSTGRES_USER:giftshop}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.issuer=giftshop
jwt.access-token-ttl=15m
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:file:../secrets/jwt-private.pem}
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:../secrets/jwt-public.pem}
jwt.generate-ephemeral-keys=false

spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD}

spring.cache.redis.time-to-live=10m
spring.cache.redis.key-prefix=giftshop: